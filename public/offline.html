<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">
  <title>Lumin AI - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, rgba(214,168,75,.12), transparent 35%), linear-gradient(180deg,#050507 0%,#020203 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    .container { text-align: center; max-width: 420px; }
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: radial-gradient(circle at 35% 25%, #ffe7a5 0%, #d6a84b 28%, #7f531c 70%, #120f0b 100%);
      border: 1px solid rgba(240,200,107,.45);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 46px rgba(214,168,75,.24), inset 0 0 28px rgba(255,255,255,.08);
      animation: luminPulse 2.4s ease-in-out infinite;
    }
    .mark { font-size: 42px; font-weight: 800; color: #090704; text-shadow: 0 1px 0 rgba(255,255,255,.25); }
    h1 { font-size: 30px; font-weight: 700; margin-bottom: 10px; color: #f2d083; }
    .brand { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: #a9874a; margin-bottom: 24px; }
    p { color: #a1a1aa; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
    button {
      background: linear-gradient(135deg, #f0cf7a 0%, #b77921 100%);
      color: #090704;
      border: 1px solid rgba(255,230,160,.55);
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 12px 30px rgba(214,168,75,.16);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(214,168,75,.26); }
    button:active { transform: translateY(0); }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes luminPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><span class="mark">L</span></div>
    <div class="brand">Lumin AI</div>
    <h1>Estás offline</h1>
    <p>Parece que perdeste a ligação à internet. Assim que a conexão regressar, o Lumin volta a ficar disponível.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
    <p class="pulse" style="margin-top:30px;font-size:14px;">A aguardar ligação...</p>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
