<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falar com o Lumin | LUMIN AI</title>
<meta name="description" content="Fala com o Lumin por voz em tempo real, diretamente pelo navegador.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/lumin-ai-logo.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
:root{--bg:#030303;--panel:#090909;--gold:#e7b95f;--gold2:#ffdda0;--mut:#9f9a92;--red:#ff4d4f;--green:#35d06f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(800px 500px at 50% -10%,rgba(231,185,95,.15),transparent 65%),#030303;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:24px}
.shell{width:min(430px,100%);min-height:620px;border:1px solid rgba(255,221,160,.18);border-radius:34px;background:linear-gradient(180deg,#0c0b09,#050505 60%);box-shadow:0 35px 110px rgba(0,0,0,.55);padding:28px 22px 24px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.shell:before{content:"";position:absolute;width:310px;height:310px;border-radius:50%;top:55px;background:radial-gradient(circle,rgba(231,185,95,.13),rgba(231,185,95,.03) 45%,transparent 70%);pointer-events:none}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{color:#d8d1c5;text-decoration:none;font-size:14px}.secure{color:#847e75;font-size:11px}
.avatar{margin-top:52px;width:142px;height:142px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,221,160,.35);background:radial-gradient(circle at 50% 20%,#402b0e,#0b0906 58%,#050505);box-shadow:0 0 0 16px rgba(231,185,95,.025),0 0 65px rgba(231,185,95,.12);position:relative;z-index:1;transition:.3s}
.avatar.active{box-shadow:0 0 0 18px rgba(53,208,111,.035),0 0 70px rgba(53,208,111,.15)}
.avatar.speaking{border-color:rgba(255,221,160,.72);animation:avatarPulse 1.1s ease-in-out infinite alternate;box-shadow:0 0 0 18px rgba(231,185,95,.05),0 0 86px rgba(231,185,95,.28)}
.avatar.listening{box-shadow:0 0 0 18px rgba(53,208,111,.035),0 0 72px rgba(53,208,111,.16)}
@keyframes avatarPulse{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.035);filter:brightness(1.12)}}
.avatar img{width:76px;height:76px;filter:drop-shadow(0 0 18px rgba(231,185,95,.38))}
h1{font-size:34px;letter-spacing:-.04em;margin:28px 0 4px;position:relative;z-index:1}
.sub{color:var(--gold2);font-size:13px;font-weight:800;letter-spacing:.05em;position:relative;z-index:1}
.voiceBadge{margin-top:10px;padding:6px 9px;border:1px solid rgba(255,221,160,.15);border-radius:999px;color:#8e887f;background:rgba(255,255,255,.018);font-size:9px;font-weight:800;letter-spacing:.09em;position:relative;z-index:1}
.status{margin-top:22px;color:var(--mut);font-size:14px;min-height:22px;text-align:center;position:relative;z-index:1}
.timer{margin-top:6px;color:#777169;font-variant-numeric:tabular-nums;font-size:13px;min-height:18px}
.wave{height:44px;display:flex;align-items:center;justify-content:center;gap:4px;margin:20px 0 8px;opacity:.35}
.wave i{display:block;width:3px;height:12px;border-radius:99px;background:linear-gradient(var(--gold2),var(--gold));animation:b 1.1s ease-in-out infinite alternate;animation-play-state:paused}
.wave.active{opacity:1}.wave.active i{animation-play-state:running}.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}.wave i:nth-child(6){animation-delay:.6s}.wave i:nth-child(7){animation-delay:.72s}
@keyframes b{from{height:8px}to{height:38px}}
.spacer{flex:1}
.controls{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative;z-index:1}
button{appearance:none;border:0;min-height:56px;border-radius:999px;font:inherit;font-weight:900;cursor:pointer}
.call{grid-column:1/-1;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#171108;box-shadow:0 12px 35px rgba(231,185,95,.14)}
.mute{background:#171717;color:#fff;border:1px solid rgba(255,255,255,.09)}
.end{background:#3a1010;color:#ffd0d0;border:1px solid rgba(255,77,79,.24)}
.hidden{display:none!important}
.note{margin-top:18px;color:#68635c;font-size:11px;line-height:1.5;text-align:center}
#error{color:#ff9898;margin-top:12px;font-size:12px;text-align:center;min-height:18px}
#audioRoot{display:none}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><a class="back" href="/">← LUMIN AI</a><span class="secure">voz via internet · WebRTC</span></div>
  <div id="avatar" class="avatar"><img src="/lumin-ai-logo.svg" alt="LUMIN AI"></div>
  <h1>Lumin</h1>
  <div class="sub">ASSISTENTE VIRTUAL IA</div>
  <div class="voiceBadge">VOZ PT-PT · OPEN SOURCE</div>
  <div id="status" class="status">Pronto para falar contigo.</div>
  <div id="timer" class="timer"></div>
  <div id="wave" class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="spacer"></div>
  <div class="controls">
    <button id="callBtn" class="call">📞 FALAR COM O LUMIN</button>
    <button id="muteBtn" class="mute hidden">🎙️ Silenciar</button>
    <button id="endBtn" class="end hidden">✕ Desligar</button>
  </div>
  <div id="error"></div>
  <div class="note">O microfone só é usado durante a conversa. Não é uma chamada telefónica: não usa saldo nem mostra qualquer número.</div>
</main>
<div id="audioRoot"></div>
<script>
(function(){
  const GATEWAY='/api/voice-gateway';
  const callBtn=document.getElementById('callBtn');
  const muteBtn=document.getElementById('muteBtn');
  const endBtn=document.getElementById('endBtn');
  const statusEl=document.getElementById('status');
  const timerEl=document.getElementById('timer');
  const wave=document.getElementById('wave');
  const avatar=document.getElementById('avatar');
  const errorEl=document.getElementById('error');
  const audioRoot=document.getElementById('audioRoot');

  let room=null, muted=false, startedAt=0, timerHandle=null;
  const voiceChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('lumin-voice-single-session') : null;
  const tabId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();

  function setStatus(t){statusEl.textContent=t}
  function startTimer(){
    startedAt=Date.now();
    clearInterval(timerHandle);
    timerHandle=setInterval(()=>{
      const s=Math.floor((Date.now()-startedAt)/1000);
      timerEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    },500);
  }
  function resetUI(){
    clearInterval(timerHandle);timerHandle=null;timerEl.textContent='';
    wave.classList.remove('active');avatar.classList.remove('active','speaking','listening');
    callBtn.classList.remove('hidden');muteBtn.classList.add('hidden');endBtn.classList.add('hidden');
    callBtn.disabled=false;callBtn.textContent='📞 FALAR COM O LUMIN';
    muted=false;muteBtn.textContent='🎙️ Silenciar';
  }

  async function endCall(silent=false){
    if(room){
      try{await room.localParticipant.setMicrophoneEnabled(false)}catch(e){}
      try{await room.disconnect()}catch(e){}
      room=null;
    }
    audioRoot.innerHTML='';
    if(!silent) setStatus('Chamada terminada.');
    resetUI();
  }

  if(voiceChannel){
    voiceChannel.onmessage = (ev)=>{
      if(ev.data && ev.data.type==='new-call' && ev.data.tabId!==tabId && room){
        endCall(true);
        setStatus('Chamada transferida para outro separador.');
      }
    };
  }

  async function startCall(){
    if(voiceChannel) voiceChannel.postMessage({type:'new-call',tabId});
    errorEl.textContent='';
    callBtn.disabled=true;callBtn.textContent='A ligar…';
    setStatus('A ligar ao Lumin…');
    if(navigator.vibrate) navigator.vibrate([90,80,90]);

    try{
      const res=await fetch(GATEWAY+'/token',{method:'POST',headers:{'Content-Type':'application/json'}});
      if(!res.ok) throw new Error('Não foi possível iniciar a sessão.');
      const data=await res.json();

      room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});

      room.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>{
        if(track.kind===LivekitClient.Track.Kind.Audio){
          const el=track.attach();
          el.autoplay=true;
          audioRoot.appendChild(el);
          room.startAudio().catch(()=>{});
          setStatus('Lumin atendeu · fala normalmente');
          avatar.classList.add('active','listening');
          if(!startedAt) startTimer();
        }
      });

      room.on(LivekitClient.RoomEvent.ParticipantConnected,()=>{
        setStatus('Lumin atendeu · a preparar voz…');
        avatar.classList.add('active','listening');
      });

      room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged,(speakers)=>{
        if(!room) return;
        const remoteSpeaking=speakers.some((p)=>p.identity!==room.localParticipant.identity);
        avatar.classList.add('active');
        avatar.classList.toggle('speaking',remoteSpeaking);
        avatar.classList.toggle('listening',!remoteSpeaking);
        wave.classList.toggle('active',remoteSpeaking);
        if(!muted){
          setStatus(remoteSpeaking?'Lumin está a falar…':'Lumin está a ouvir…');
        }
      });

      room.on(LivekitClient.RoomEvent.Disconnected,()=>{
        room=null;
        setStatus('Chamada terminada.');
        resetUI();
      });

      await room.connect(data.serverUrl,data.token);
      await room.startAudio().catch(()=>{});
      await room.localParticipant.setMicrophoneEnabled(true,{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      });

      callBtn.classList.add('hidden');
      muteBtn.classList.remove('hidden');
      endBtn.classList.remove('hidden');
      setStatus('Ligado · à espera do Lumin…');
      startTimer();
    }catch(err){
      console.error(err);
      errorEl.textContent=(err&&err.message)||'Não foi possível ligar. Confirma a permissão do microfone e tenta novamente.';
      setStatus('Não foi possível iniciar a chamada.');
      if(room){try{await room.disconnect()}catch(e){} room=null}
      resetUI();
    }
  }

  callBtn.addEventListener('click',startCall);
  endBtn.addEventListener('click',endCall);
  muteBtn.addEventListener('click',async()=>{
    if(!room)return;
    muted=!muted;
    await room.localParticipant.setMicrophoneEnabled(!muted);
    muteBtn.textContent=muted?'🔇 Ativar microfone':'🎙️ Silenciar';
    setStatus(muted?'Microfone desligado':'Lumin está a ouvir');
  });
  window.addEventListener('pagehide',()=>{if(room)room.disconnect()});
})();
</script>
</body>
</html>
