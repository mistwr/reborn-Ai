<!doctype html>
<html lang="pt">
  <body style="margin:0;background:#050507;font-family:Arial,Helvetica,sans-serif;color:#f5f5f5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#050507;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#0b0b0f;border:1px solid #2a2317;border-radius:22px;overflow:hidden;">
            <tr>
              <td style="padding:34px 34px 18px;text-align:center;">
                <div style="display:inline-block;padding:12px 16px;border-radius:16px;background:#17130b;border:1px solid #6f5424;color:#f3c96c;font-weight:700;font-size:18px;letter-spacing:.04em;">✦ Lumin AI</div>
                <h1 style="margin:26px 0 10px;font-size:28px;line-height:1.2;color:#ffffff;">Entrar no Lumin AI</h1>
                <p style="margin:0;color:#9c9ca6;font-size:15px;line-height:1.6;">Usa o código abaixo ou abre o link seguro para entrares sem password.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 34px 4px;text-align:center;">
                <div style="margin:0 auto 24px;max-width:300px;border-radius:18px;background:#111116;border:1px solid #292932;padding:20px;color:#f3c96c;font-family:monospace;font-size:30px;font-weight:700;letter-spacing:.28em;">{{ .Token }}</div>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(90deg,#6b4a16,#b87a22,#6a4514);color:#ffffff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:14px;">Entrar no Lumin AI</a>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 34px 34px;">
                <p style="margin:0 0 8px;color:#777783;font-size:12px;line-height:1.6;">Este acesso é pessoal, expira em breve e só pode ser usado uma vez.</p>
                <p style="margin:0;color:#5f5f69;font-size:12px;line-height:1.6;">Se não pediste este acesso, ignora este email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
