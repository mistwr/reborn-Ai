name: Genesis validation
on:
  pull_request:
    paths:
      - "lib/lumin-genesis*.ts"
      - "app/api/genesis/**"
      - "app/genesis/**"
      - "tests/lumin-genesis.test.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/lumin-genesis.test.ts
      - run: npx tsc --noEmit
